# CI on the GitHub mirror: the same tests the GitLab pipeline runs, so the
# public repo shows its own status, plus the image publish to GHCR. Security
# scanning on GitHub is handled by CodeQL default setup and secret scanning
# (repository settings), not here.
name: ci
permissions:
  contents: read
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run fetch-upstream -- "$(cat .upstream-ref)" --patch
      - run: npm test
      - run: npm run e2e
  # Build, boot-check, and on a push to main or a v* tag publish to GHCR.
  # Tags: `main` and `sha-<short>` from main; `<version>` and `latest` from a
  # tag. Plain docker commands, no third-party actions to pin.
  image:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: |
          docker build -f docker/Dockerfile --build-arg MINDSPARK_REF="$(cat .upstream-ref)" \
            --label org.opencontainers.image.source="https://github.com/${{ github.repository }}" \
            --label org.opencontainers.image.revision="${{ github.sha }}" \
            --label org.opencontainers.image.licenses=MIT \
            --label io.mindspark.upstream-ref="$(cat .upstream-ref)" \
            -t mindspark-collab:ci .
      - run: docker run --rm -e AUTH_SECRET=ci mindspark-collab:ci node --disable-warning=ExperimentalWarning -e "import('/app/src/collab/server.js').then(()=>console.log('boots'))"
      - if: github.event_name == 'push'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          for t in main "sha-${GITHUB_SHA::7}"; do docker tag mindspark-collab:ci "$IMAGE:$t" && docker push "$IMAGE:$t"; done
      - if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          for t in "${GITHUB_REF_NAME#v}" latest; do docker tag mindspark-collab:ci "$IMAGE:$t" && docker push "$IMAGE:$t"; done
