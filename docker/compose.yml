# docker/compose.yml - run next to your forge. Build context is the repo root.
services:
  mindspark-collab:
    image: mindspark-collab
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        MINDSPARK_REF: ${MINDSPARK_REF:-4e81dc626b136054dba463dc188b7a6304c9bbeb}
    container_name: mindspark-collab
    restart: unless-stopped
    env_file: .env
    volumes:
      - collab-data:/app/data
    # The process writes only to /app/data; everything else can be read-only,
    # unprivileged and bounded.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    # Example for traefik on an external "proxy" network - adjust host and resolver.
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mindspark.rule=Host(`${COLLAB_HOST}`)"
      - "traefik.http.routers.mindspark.entrypoints=https"
      - "traefik.http.routers.mindspark.tls=true"
      - "traefik.http.routers.mindspark.tls.certresolver=ionos"
      - "traefik.http.services.mindspark.loadbalancer.server.port=3000"
    networks: [proxy]
volumes:
  collab-data:
networks:
  proxy:
    external: true
